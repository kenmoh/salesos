<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ name }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px 24px;
      text-align: center;
    }
    .header .store { font-size: 13px; opacity: 0.7; margin-bottom: 4px; }
    .header .name { font-size: 22px; font-weight: 700; line-height: 1.3; }
    .body { padding: 24px; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .row:last-child { border-bottom: none; }
    .label { color: #888; font-size: 14px; }
    .value { font-size: 15px; font-weight: 600; color: #222; }
    .price {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a2e;
      text-align: center;
      padding: 20px 0 8px;
    }
    .stock-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .stock-badge.in-stock { background: #e6f9ee; color: #1a7a4c; }
    .stock-badge.low-stock { background: #fff3e0; color: #c77700; }
    .stock-badge.out-of-stock { background: #fdecea; color: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="store">{{ store_name }}</div>
      <div class="name">{{ name }}</div>
    </div>
    <div class="body">
      <div class="price">&#8358;{{ "%.2f"|format(selling_price) }}</div>
      <div class="row">
        <span class="label">SKU</span>
        <span class="value">{{ sku or "N/A" }}</span>
      </div>
      <div class="row">
        <span class="label">Stock</span>
        {% if stock_qty > 10 %}
          <span class="stock-badge in-stock">In Stock ({{ stock_qty|int }})</span>
        {% elif stock_qty > 0 %}
          <span class="stock-badge low-stock">Low Stock ({{ stock_qty|int }})</span>
        {% else %}
          <span class="stock-badge out-of-stock">Out of Stock</span>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
